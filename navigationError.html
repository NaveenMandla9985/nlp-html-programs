<!DOCTYPE html>
<html>
<head>
    <title>Navigation Failure Redirect Loop 60 seconns</title>

    <script>
        const startTime = Date.now();
        const maxDuration = 60000; // 60 seconds

        const existingStart = sessionStorage.getItem("navStart");

        if (!existingStart) {
            sessionStorage.setItem("navStart", startTime);
        }

        const elapsed = Date.now() - Number(sessionStorage.getItem("navStart"));

        if (elapsed < maxDuration) {
            setTimeout(() => {
                location.href = location.pathname + "?t=" + Date.now();
            }, 500);
        } else {
            // After 60 seconds, redirect to a hanging page
            location.href = "hang.html";
        }
    </script>
</head>
<body>
    <h1>Redirect Loop Running...</h1>
    <p>This page will keep redirecting for 60 seconds.</p>
</body>
</html>
