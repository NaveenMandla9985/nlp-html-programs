<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Non Empty Text NLP Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f4f4f4;
    }

    h2 {
      color: #222;
      margin-bottom: 20px;
    }

    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 20px;
      background-color: white;
      width: 350px;
    }

    #nonEmptyDiv {
      color: green;
      font-weight: bold;
    }

    #emptyDiv {
      min-height: 25px;
    }
  </style>
</head>

<body>

  <h2 id="headingText">
    Testsigma NLP Validation
  </h2>

  <!-- Non-empty text element -->
  <div id="nonEmptyDiv" class="box">
    This div contains text.
  </div>

  <!-- Empty text element -->
  <div id="emptyDiv" class="box"></div>

</body>
</html>
