<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scrollable Container Demo</title>
<style>
  * { box-sizing: border-box; }

  /* Lock the outer page so it never scrolls */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
  }

  .page {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    margin: 0 0 16px 0;
    font-size: 20px;
    color: #333;
  }

  /* This is the container that scrolls internally */
  .scroll-container {
    width: 700px;
    max-width: 100%;
    height: 500px;      /* fixed height -> content beyond this scrolls */
    overflow-y: auto;   /* enables the internal scrollbar */
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 20px;
  }

  .field-group {
    display: grid;
    grid-template-columns: 160px 1fr;
    align-items: center;
    gap: 10px 16px;
    margin-bottom: 18px;
  }

  .field-group label {
    font-size: 13px;
    color: #444;
    text-align: right;
  }

  .field-group input,
  .field-group select {
    height: 32px;
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 13px;
  }

  .field-group input:focus {
    outline: none;
    border-color: #c9184a;
    box-shadow: 0 0 0 2px rgba(201, 24, 74, 0.15);
  }

  .highlight {
    border-color: #c9184a !important;
    background: #fffbe6;
  }
</style>
</head>
<body>

  <div class="page">
    <h1>Claim Form (Scrollable Container Demo)</h1>

    <div class="scroll-container">

      <div class="field-group">
        <label>Diagnosis 2</label>
        <select><option>Select</option></select>
      </div>

      <div class="field-group">
        <label>Others</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Provider Code</label>
        <input type="text" value="0000000001">
      </div>

      <div class="field-group">
        <label>Provider Type</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Provider Name</label>
        <select><option>81 FAMILY CLINIC [PHPC Clinic]</option></select>
      </div>

      <div class="field-group">
        <label>Specialty</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Name of Doctor</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Batch ID</label>
        <input type="text" class="highlight" value="77406">
      </div>

      <div class="field-group">
        <label>Invoice No</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>LOG Serial No</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Hospital Case No</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Hospital Account No</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>TPA Upload Batch ID</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>TPA Claim Ref No</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>TPA Illness Type</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Ex-Gratia</label>
        <input type="checkbox" style="justify-self: start; width: 18px; height: 18px;">
      </div>

      <div class="field-group">
        <label>Appeal Claim</label>
        <input type="checkbox" style="justify-self: start; width: 18px; height: 18px;">
      </div>

      <div class="field-group">
        <label>Shortfall</label>
        <input type="checkbox" style="justify-self: start; width: 18px; height: 18px;">
      </div>

      <div class="field-group">
        <label>Shortfall Settlement</label>
        <input type="checkbox" checked style="justify-self: start; width: 18px; height: 18px;">
      </div>

      <div class="field-group">
        <label>Remarks</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Extra Field 1</label>
        <input type="text">
      </div>

      <div class="field-group">
        <label>Extra Field 2</label>
        <input type="text">
      </div>

    </div>
  </div>

</body>
</html>
