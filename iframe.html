<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page with Embedded Iframe</title>
</head>
<body>

    <h2>Main Page</h2>

    <input
        id="username"
        name="username"
        data-id="username"
        type="text"
        placeholder="Main Username">

    <button
        id="submitBtn"
        name="submitBtn"
        data-id="submitBtn">
        Submit
    </button>

    <hr>

    <iframe
        id="sampleFrame"
        name="sampleFrame"
        width="500"
        height="200"
        srcdoc='
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
        }
    </style>
</head>
<body>

    <h3>Iframe Content</h3>

    <input
        id="username"
        name="username"
        data-id="username"
        type="text"
        placeholder="Iframe Username">

    <button
        id="submitBtn"
        name="submitBtn"
        data-id="submitBtn">
        Submit
    </button>

</body>
</html>'>
    </iframe>

</body>
</html>
