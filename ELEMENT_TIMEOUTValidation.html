<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ELEMENT_TIMEOUT Validation</title>

  <style>

    body {

      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f5f5;

    }

    h1 {

      color: #333;

    }

    p {

      margin-bottom: 20px;

    }

    /*
      Element exists in DOM
      but is never displayed
    */

    #delayedButton {

      display: none;

      padding: 12px 20px;
      background-color: green;
      color: white;

      border: none;
      border-radius: 5px;

      font-size: 16px;

      cursor: pointer;

    }

  </style>

</head>

<body>

  <h1>ELEMENT_TIMEOUT Demo</h1>

  <p>

    The button exists in the DOM
    but never becomes visible.

  </p>

  <p>

    Testsigma should keep waiting
    until timeout occurs.

  </p>

  <!-- Hidden element -->

  <button id="delayedButton">

    Login

  </button>

</body>

</html>
