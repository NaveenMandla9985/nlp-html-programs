<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Testing Playground</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}

.container{
  width:95%;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{text-align:center;margin-bottom:20px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#111827;
  color:#fff;
}

input:focus,select:focus,textarea:focus{
  outline:none;
  box-shadow:0 0 0 2px #6366f1;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
}

button:hover{transform:scale(1.05)}

.progress{
  background:#111;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:12px;
  width:60%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
}

.scroll{
  height:120px;
  overflow-y:auto;
  background:#020617;
  padding:10px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,.table td{
  padding:10px;
  border-bottom:1px solid #333;
}

.badge{
  padding:5px 10px;
  background:#22c55e;
  border-radius:20px;
}

.hidden{display:none}

.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}

iframe{width:100%;height:120px;border:none}

</style>
</head>

<body>
<div class="container">

<h1 id="title">🚀 Enterprise QA Playground</h1>

<div class="card">
<h2>Form Section</h2>
<div class="grid">
<input id="fname" name="fname" placeholder="First Name">
<input id="lname" name="lname" placeholder="Last Name">
<input id="email" name="email" type="email">
<input id="password" name="password" type="password">

<select id="country" name="country">
<option>USA</option><option>India</option>
</select>

<select id="state" name="state">
<option>California</option><option>Texas</option>
</select>

<label><input type="radio" name="gender" value="male"> Male</label>
<label><input type="radio" name="gender" value="female"> Female</label>

<label><input type="checkbox" name="skills" value="automation"> Automation</label>
<label><input type="checkbox" name="skills" value="api"> API</label>

<textarea id="msg" name="msg" placeholder="Message"></textarea>

<input type="file" id="fileUpload">

<button id="submit">Submit</button>
<button id="disabledBtn" disabled>Disabled</button>
</div>
</div>

<div class="card">
<h2>Progress Bars</h2>
<div class="progress"><div class="progress-bar" id="p1"></div></div>
<div class="progress"><div class="progress-bar" style="width:30%"></div></div>
</div>

<div class="card">
<h2>Scrollable List</h2>
<div class="scroll" id="scrollBox">
<p>Item1</p><p>Item2</p><p>Item3</p><p>Item4</p><p>Item5</p><p>Item6</p>
</div>
</div>

<div class="card">
<h2>Table</h2>
<table class="table" id="dataTable">
<tr><th>Name</th><th>Status</th></tr>
<tr><td>Test1</td><td><span class="badge">Active</span></td></tr>
<tr><td>Test2</td><td><span class="badge">Active</span></td></tr>
</table>
</div>

<div class="card">
<h2>Iframe</h2>
<iframe id="frame1" srcdoc="<input id='innerInput'>"></iframe>
</div>

<div class="card">
<h2>Nested Iframe</h2>
<iframe id="outerFrame" srcdoc="<iframe id='innerFrame' srcdoc='<button id=btn>Click</button>'></iframe>"></iframe>
</div>

<div class="card">
<h2>Modal</h2>
<button onclick="openModal()">Open Modal</button>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<p>Modal Content</p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
function openModal(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}

document.getElementById('submit').onclick=()=>alert('Submitted')
</script>

</body>
</html>
